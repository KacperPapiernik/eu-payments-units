<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie - Settlement UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 text-bg-dark">
  <div class="card text-bg-secondary shadow" style="width: 24rem;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-bank fs-1"></i>
        <h4 class="mt-2">Panel Rozliczeniowy</h4>
        <p class="text-light-emphasis small">System rozliczeń SEPA / TARGET</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="mb-3">
          <label class="form-label small">Użytkownik</label>
          <input type="text" name="username" class="form-control" placeholder="admin / operator" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small">Hasło</label>
          <input type="password" name="password" class="form-control" placeholder="***" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
      </form>

      <div class="mt-3 text-center small text-light-emphasis">
        admin / admin123<br>
        operator / operator123
      </div>
    </div>
  </div>
</body>
</html>
